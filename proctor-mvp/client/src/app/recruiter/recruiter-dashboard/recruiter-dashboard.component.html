<div class="recruiter-dashboard">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Proctor MVP</h2>
      <p class="subtitle">Recruiter Dashboard</p>
    </div>
    <nav class="sidebar-nav">
      <a routerLink="/recruiter/tests" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
        <span class="icon">📋</span>
        <span>My Tests</span>
      </a>
      <a routerLink="/recruiter/create" routerLinkActive="active">
        <span class="icon">➕</span>
        <span>Create Test</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <span class="icon">🚪</span>
        <span>Logout</span>
      </button>
    </div>
  </aside>
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
